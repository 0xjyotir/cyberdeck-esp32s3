<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Cyberdeck ESP32-S3: a schematic board with six signal lines pulsing out of the chip">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#0f1d35" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="t-wifi" d="M700 180 L700 130 L760 130 L800 90 L1000 90"/>
    <path id="t-tft"  d="M580 180 L580 130 L520 130 L480 90 L280 90"/>
    <path id="t-ble"  d="M740 210 L900 210 L950 190 L1120 190"/>
    <path id="t-ir"   d="M700 240 L700 290 L860 290 L920 340 L1040 340"/>
    <path id="t-nrf"  d="M580 240 L580 290 L420 290 L360 340 L240 340"/>
    <path id="t-rfid" d="M530 210 L380 210 L330 190 L170 190"/>
  </defs>

  <rect width="1280" height="420" fill="#060b16"/>
  <rect width="1280" height="420" fill="url(#grid)"/>

  <!-- board outline -->
  <rect x="110" y="50" width="1060" height="330" rx="22" fill="none" stroke="#2c4677" stroke-width="2" stroke-dasharray="10 6"/>

  <!-- dashed base traces -->
  <g fill="none" stroke="#2c4677" stroke-width="2.5" stroke-dasharray="7 5" stroke-linejoin="round">
    <use href="#t-wifi"/><use href="#t-tft"/><use href="#t-ble"/><use href="#t-ir"/><use href="#t-nrf"/><use href="#t-rfid"/>
  </g>

  <!-- chip -->
  <rect x="530" y="170" width="220" height="80" rx="10" fill="#0f1d35" stroke="#2c4677" stroke-width="2"/>
  <text x="640" y="203" fill="#dce8ff" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="2">CYBERDECK</text>
  <text x="640" y="230" fill="#8aa0c8" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" letter-spacing="3">ESP32-S3 · N16R8</text>
  <circle cx="738" cy="182" r="4" fill="#57e389">
    <animate attributeName="opacity" values="0.25;1;0.25" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- pads + labels -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5" text-anchor="middle">
    <circle cx="1000" cy="90" r="6" fill="#58c6ff"/><text x="1000" y="72" fill="#58c6ff">WIFI</text>
    <circle cx="280" cy="90" r="6" fill="#ff9e80"/><text x="280" y="72" fill="#ff9e80">2.8" TFT</text>
    <circle cx="1120" cy="190" r="6" fill="#a9b8ff"/><text x="1120" y="172" fill="#a9b8ff">BLE</text>
    <circle cx="1040" cy="340" r="6" fill="#ffd27a"/><text x="1040" y="366" fill="#ffd27a">IR</text>
    <circle cx="240" cy="340" r="6" fill="#7aa0ff"/><text x="240" y="366" fill="#7aa0ff">NRF24</text>
    <circle cx="170" cy="190" r="6" fill="#8ef0d0"/><text x="170" y="172" fill="#8ef0d0">RC522 RFID</text>
  </g>

  <!-- travelling signal pulses -->
  <g filter="url(#glow)">
    <circle r="5" fill="#58c6ff"><animateMotion dur="2.2s" begin="0s" repeatCount="indefinite"><mpath href="#t-wifi"/></animateMotion></circle>
    <circle r="5" fill="#ff9e80"><animateMotion dur="2.4s" begin="-0.4s" repeatCount="indefinite"><mpath href="#t-tft"/></animateMotion></circle>
    <circle r="5" fill="#a9b8ff"><animateMotion dur="2.0s" begin="-0.8s" repeatCount="indefinite"><mpath href="#t-ble"/></animateMotion></circle>
    <circle r="5" fill="#ffd27a"><animateMotion dur="2.5s" begin="-0.2s" repeatCount="indefinite"><mpath href="#t-ir"/></animateMotion></circle>
    <circle r="5" fill="#7aa0ff"><animateMotion dur="2.1s" begin="-1.0s" repeatCount="indefinite"><mpath href="#t-nrf"/></animateMotion></circle>
    <circle r="5" fill="#8ef0d0"><animateMotion dur="2.3s" begin="-0.6s" repeatCount="indefinite"><mpath href="#t-rfid"/></animateMotion></circle>
  </g>
</svg>
